<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Editor - Live Studio</title>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1a1d27;
      --border: #2a2e3d;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    
    .sidebar { width: 440px; background: var(--card-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .header { padding: 20px; border-bottom: 1px solid var(--border); }
    .header h1 { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    
    .chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; line-height: 1.4; max-width: 90%; }
    .msg-user { background: var(--accent); align-self: flex-end; color: #fff; }
    .msg-ai { background: #262a38; border: 1px solid var(--border); align-self: flex-start; }
    
    .input-bar { padding: 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .input-bar input { flex: 1; background: #0f1117; border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; color: var(--text); font-size: 0.9rem; outline: none; }
    .input-bar input:focus { border-color: var(--accent); }
    .btn { background: var(--accent); border: none; border-radius: 6px; color: white; padding: 10px 16px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: #2d3348; color: var(--text); }
    .btn-secondary:hover { background: #39405a; }

    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .top-actions { padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #131620; }
    .status-badge { font-size: 0.85rem; padding: 4px 10px; border-radius: 20px; background: #222738; color: #a5b4fc; }

    .preview-pane { flex: 1; padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
    .video-wrapper { width: 100%; max-width: 880px; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid var(--border); }
    video { width: 100%; height: 100%; object-fit: contain; }

    .timeline-inspector { height: 200px; background: #131620; border-top: 1px solid var(--border); padding: 16px 24px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; color: #a5b4fc; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="header">
      <h1>🎬 AI Video Editor</h1>
      <p style="color: var(--text-muted); font-size: 0.8rem; margin-top: 4px;">Prompt-Driven Remotion Studio</p>
    </div>

    <div class="chat-container" id="chat">
      <div class="message msg-ai">
        Hello! Type any edit instructions, e.g.:
        <br>• "Make captions yellow and bigger"
        <br>• "Add a title 'Welcome to Video Creation' at 1 second"
        <br>• "Trim first 2 seconds"
      </div>
    </div>

    <form class="input-bar" id="prompt-form">
      <input type="text" id="prompt-input" placeholder="Type an edit instruction..." required autocomplete="off" />
      <button type="submit" class="btn" id="send-btn">Apply</button>
    </form>
  </div>

  <div class="main">
    <div class="top-actions">
      <span class="status-badge" id="status-text">Ready</span>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-secondary" id="undo-btn">↩ Undo</button>
        <button class="btn" id="render-btn">⚡ Export MP4</button>
      </div>
    </div>

    <div class="preview-pane">
      <div class="video-wrapper">
        <video id="player" controls autoplay muted loop src="/out/final.mp4"></video>
      </div>
    </div>

    <div class="timeline-inspector">
      <div style="font-weight: bold; margin-bottom: 6px; color: #e0e7ff;">Current Timeline State (timeline.json)</div>
      <pre id="timeline-json">Loading...</pre>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('prompt-form');
    const input = document.getElementById('prompt-input');
    const statusText = document.getElementById('status-text');
    const undoBtn = document.getElementById('undo-btn');
    const renderBtn = document.getElementById('render-btn');
    const timelinePre = document.getElementById('timeline-json');
    const player = document.getElementById('player');

    async function refreshTimeline() {
      try {
        const res = await fetch('/api/timeline');
        const data = await res.json();
        timelinePre.textContent = JSON.stringify(data.timeline, null, 2);
      } catch (e) {
        console.error(e);
      }
    }

    refreshTimeline();

    function appendMessage(text, role) {
      const msg = document.createElement('div');
      msg.className = `message msg-${role}`;
      msg.innerHTML = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = input.value.trim();
      if (!prompt) return;

      appendMessage(prompt, 'user');
      input.value = '';
      statusText.textContent = 'Applying AI edits...';

      try {
        const res = await fetch('/api/edit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });
        const data = await res.json();
        if (data.success) {
          appendMessage(`<b>Edit applied:</b> ${data.summary}`, 'ai');
          timelinePre.textContent = JSON.stringify(data.timeline, null, 2);
          statusText.textContent = 'Edits applied successfully';
        } else {
          appendMessage(`<b>Error:</b> ${data.error || 'Failed to apply edits'}`, 'ai');
          statusText.textContent = 'Edit failed';
        }
      } catch (err) {
        appendMessage(`<b>Error:</b> ${err.message}`, 'ai');
        statusText.textContent = 'Error';
      }
    });

    undoBtn.addEventListener('click', async () => {
      statusText.textContent = 'Undoing last change...';
      try {
        const res = await fetch('/api/undo', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          appendMessage('<i>Restored previous timeline snapshot.</i>', 'ai');
          timelinePre.textContent = JSON.stringify(data.timeline, null, 2);
          statusText.textContent = 'Restored snapshot';
        } else {
          appendMessage(`<b>Undo error:</b> ${data.error}`, 'ai');
          statusText.textContent = 'Undo failed';
        }
      } catch (err) {
        appendMessage(`<b>Error:</b> ${err.message}`, 'ai');
        statusText.textContent = 'Error';
      }
    });

    renderBtn.addEventListener('click', async () => {
      statusText.textContent = 'Rendering MP4... (please wait)';
      renderBtn.disabled = true;
      try {
        const res = await fetch('/api/render', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          statusText.textContent = 'Export complete!';
          player.src = `${data.output}?t=${Date.now()}`;
          player.play();
          appendMessage(`<b>Exported:</b> <a href="${data.output}" target="_blank" style="color: #818cf8;">Download MP4</a>`, 'ai');
        } else {
          appendMessage(`<b>Render error:</b> ${data.error}`, 'ai');
        }
      } catch (err) {
        appendMessage(`<b>Error:</b> ${err.message}`, 'ai');
      } finally {
        renderBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
